<style>

 radial-gradient(120% 55% at 50% -8%,#ffb347 0,#ff8a1f 22%,#e65100 48%,transparent 72%),

 radial-gradient(60% 40% at 100% 85%,#ff9d2e40,transparent 70%),

.fly{animation:fly .8s cubic-bezier(.6,-.4,.8,.4) forwards!important}

.chk circle{stroke-dasharray:300;stroke-dashoffset:300;animation:dr .6s .1s forwards}

:root{--orange:#e53935}

<script>

/* ============ DEVICE FINGERPRINT ============ */
async function deviceId(){
  const raw=[navigator.userAgent,screen.width,screen.height,screen.colorDepth,navigator.language,navigator.hardwareConcurrency,Intl.DateTimeFormat().resolvedOptions().timeZone,(()=>{try{const c=document.createElement("canvas").getContext("2d");c.font="14px Arial";c.fillText("swift",2,2);return c.canvas.toDataURL()}catch(e){return""}})()].join("|");
  const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(raw));
  return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function api(action,data={}){
  if(CONFIG.API_BASE){const r=await fetch(CONFIG.API_BASE,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,data,initData:tg?.initData||"",device:await deviceId()})});return r.json()}
  return demo(action,data);
}
function demo(a,d){ // local preview storage – use API_BASE for shared multi-user data
  const D=JSON.parse(localStorage.swiftDB5||`{"users":{},"channels":[],"wd":[],"log":[],"set":{"reward":${CONFIG.REWARD},"min":${CONFIG.MIN_WITHDRAW},"minRefs":${CONFIG.MIN_REFS},"tapReward":${CONFIG.TAP_REWARD},"tapBase":${CONFIG.TAP_BASE}},"devices":{},"tasks":[]}`);if(!D.tasks)D.tasks=[];if(!D.promos)D.promos=[];
  const save=()=>localStorage.swiftDB5=JSON.stringify(D);let u=D.users[TU.id];const S=D.set;
  const out=(o={})=>{save();return{ok:true,user:D.users[TU.id],set:S,channels:D.channels,tasks:D.tasks,promos:Number(TU.id)===Number(CONFIG.OWNER_ID)?D.promos:[],wd:Number(TU.id)===Number(CONFIG.OWNER_ID)?D.wd:[],log:D.log.slice(-15).reverse(),...o}};
  if(a==="init"){if(!u){u=D.users[TU.id]={id:TU.id,name:TU.first_name,bal:0,refs:0,by:null,joined:Date.now(),verified:false,taps:0,tapWin:0,bonus:0,adsSeen:0,swt:0,done:[]};
    const dev=localStorage.demoDev||(localStorage.demoDev=Math.random().toString(36).slice(2));
    if(D.devices[dev])u.dupe=true;else D.devices[dev]=TU.id;
    if(REF&&REF!=TU.id&&D.users[REF]&&!u.dupe)u.by=REF}return out()}
  if(a==="verify"){u.verified=true;if(u.by&&!u.paid&&D.users[u.by]){D.users[u.by].bal+=S.reward;D.users[u.by].refs++;u.paid=true}return out()}
  if(a==="tap"){const now=Date.now();if(!u.tapWin||now-u.tapWin>=36e5){u.tapWin=now;u.taps=0}
    const fromBase=Math.max(0,Math.min(d.n,S.tapBase-u.taps)),fromBonus=Math.max(0,Math.min(d.n-fromBase,u.bonus||0));
    u.taps+=fromBase;u.bonus=(u.bonus||0)-fromBonus;u.swt=+((u.swt||0)+(fromBase+fromBonus)*S.tapReward).toFixed(3);return out()}
  if(a==="claim"){u.done=u.done||[];const k=D.tasks.find(x=>x.id==d.id);if(!k)return{ok:false,msg:"Task not found"};if(u.done.includes(k.id))return{ok:false,msg:t("taken")};u.done.push(k.id);u.bal=+(u.bal+k.reward).toFixed(4);k.claims=(k.claims||0)+1;return out({got:k.reward})}
  if(a==="log")return out();
  if(["addch","delch","addtask","deltask"].includes(a)){
    if(Number(TU.id)!==Number(CONFIG.OWNER_ID))return{ok:false,msg:"Admin only"};
    if(a==="addch"){const c=(d.ch||"").trim();if(!c)return{ok:false,msg:"?"};const v=c.startsWith("@")?c:"@"+c;if(!D.channels.includes(v))D.channels.push(v)}
    if(a==="delch")D.channels=D.channels.filter(x=>x!==d.ch);
    if(a==="addtask"){const ch=(d.ch||"").trim();if(!d.title||!(d.reward>0))return{ok:false,msg:"?"};D.tasks.push({id:Date.now(),title:d.title,desc:d.desc||"",link:d.link||"",type:d.type||"Other",ch:ch?(ch.startsWith("@")?ch:"@"+ch):"",reward:+d.reward,claims:0})}
    if(a==="deltask")D.tasks=D.tasks.filter(x=>x.id!=d.id);
    return out()}
  if(a==="genpromo"||a==="delpromo"){
    if(Number(TU.id)!==Number(CONFIG.OWNER_ID))return{ok:false,msg:"Admin only"};
    if(a==="genpromo"){const ex=new Set(D.promos.map(p=>p.code));(d.codes||[]).forEach(c=>{if(!ex.has(c))D.promos.push({code:c,amt:+d.amt,taps:+d.taps||0,lim:+d.lim,exp:d.exp,chs:d.chs||[],used:[],ts:Date.now()})})}
    else D.promos=D.promos.filter(p=>p.code!==d.code);
    return out()}
  if(a==="promoinfo"||a==="redeem"){
    const p=D.promos.find(x=>x.code===d.code),dev=localStorage.demoDev||(localStorage.demoDev=Math.random().toString(36).slice(2));
    if(!p)return{ok:false,msg:t("pnf")};
    if(Date.now()>p.exp)return{ok:false,msg:t("pexp")};
    if(p.used.length>=p.lim)return{ok:false,msg:t("pfull")};
    if(p.used.some(x=>x.uid==u.id||x.dev==dev))return{ok:false,msg:t("pused")};
    if(a==="promoinfo")return out({pinfo:{chs:p.chs}});
    p.used.push({uid:u.id,dev,ts:Date.now()});u.bal=+(u.bal+p.amt).toFixed(4);u.bonus=(u.bonus||0)+(p.taps||0);
    return out({got:p.amt})}
  if(a==="withdraw"){if(u.refs<S.minRefs)return{ok:false,msg:t("needref")+S.minRefs};const tot=+(u.bal+(u.swt||0)*CONFIG.SWT_RATE).toFixed(4);if(tot<S.min)return{ok:false,msg:t("minw")+S.min+" "+t("b")};
    D.wd.push({id:Date.now(),uid:u.id,name:u.name,amt:tot,addr:d.addr,refs:u.refs,ts:Date.now(),st:"pending"});u.bal=0;u.swt=0;return out()}
  if(a==="wdaction"){if(Number(TU.id)!==Number(CONFIG.OWNER_ID))return{ok:false,msg:"Admin only"};const w=D.wd.find(x=>x.id==d.id);if(!w||w.st!=="pending")return{ok:false,msg:"?"};w.st=d.dec;if(d.dec==="rejected"&&D.users[w.uid])D.users[w.uid].bal=+((D.users[w.uid].bal||0)+w.amt).toFixed(4);return out()}
  if(a==="board")return out({board:Object.values(D.users).sort((x,y)=>y.refs-x.refs).slice(0,10).map(x=>({name:x.name,refs:x.refs}))});
  return{ok:false}
}

  r.setProperty("--title",`linear-gradient(90deg,#fff,${b} 50%,${a})`);
}

/* ===== TAP TAP ===== */
let pend=0,flT,combo=0,comboT,lastTap=0;
const RING=741.4;
function tapState(){const u=ST.user,S=ST.set;if(IS_ADMIN)return{lim:S.tapBase,baseLeft:S.tapBase,bonus:0,left:S.tapBase}; // owner: unlimited tapsif(u.tapWin&&Date.now()-u.tapWin>=36e5){u.taps=0;u.tapWin=0}
  const baseLeft=Math.max(0,S.tapBase-u.taps),bonus=u.bonus||0;return{lim:S.tapBase,baseLeft,bonus,left:baseLeft+bonus}}
function applyLocal(u,k){ // base taps first, then bonus taps
  const S=ST.set,fb=Math.max(0,Math.min(k,S.tapBase-u.taps)),fo=Math.max(0,Math.min(k-fb,u.bonus||0));
  u.taps+=fb;u.bonus=(u.bonus||0)-fo;u.swt=+((u.swt||0)+(fb+fo)*S.tapReward).toFixed(3);return fb+fo}
function tapUI(){const u=ST.user,{lim,baseLeft,bonus,left}=tapState();
return `<div class="card" id="tapcard"><div class="mut">🪙 ${t("swtbal")}</div><div class="bal" id="tapbal">${swtFmt(u.swt||0)}</div>
<div class="mut" id="tapbirr">≈ ${money(toBirr(u.swt||0))} · 1 SWT = ${CONFIG.SWT_RATE} ${t("b")}</div>
<div class="tapwrap"><div class="stage2" id="stage2">
 <div class="orbit"><i style="transform:translate(-50%,-50%) rotate(0deg) translateY(-118px)"></i><i style="transform:translate(-50%,-50%) rotate(120deg) translateY(-118px)"></i><i style="transform:translate(-50%,-50%) rotate(240deg) translateY(-118px)"></i></div>
 <svg class="ringsvg" viewBox="0 0 260 260"><circle class="rbg" cx="130" cy="130" r="118"/><circle class="rfg" id="tapring" cx="130" cy="130" r="118" style="stroke-dashoffset:${RING*(1-baseLeft/lim)}"/></svg>
 <div class="tapbtn ${left?"":"off"}" id="tapbtn" onpointerdown="doTap(event)"><svg width="120" height="120" viewBox="0 0 100 100"><polygon points="50,4 58,30 80,20 70,42 96,50 70,58 82,84 56,70 50,96 42,70 18,82 30,58 4,50 30,42 18,20 42,30" fill="#eaf6ff" stroke="#eaf6ff" stroke-width="9" stroke-linejoin="round"/><ellipse cx="42" cy="50" rx="4.5" ry="6.5" fill="#0a4fa8"/><ellipse cx="58" cy="50" rx="4.5" ry="6.5" fill="#0a4fa8"/></svg></div>
</div></div>
<div class="combo" id="combo"></div>
<div class="row"><span>${t("left")} <span class="bonuschip" id="tapbonus" style="${bonus?"":"display:none"}">⚡ +${bonus}</span></span><span class="ok" id="tapleft">${left}</span></div>
<div class="row"><span>${t("resets")}</span><span id="tapreset">—:—</span></div></div>
`}
function updTap(){if(ST.tab!=="tap")return;const a=$("#tapbal");if(!a)return;const u=ST.user,{lim,baseLeft,bonus,left}=tapState();
 a.textContent=swtFmt(u.swt||0);$("#tapbirr").textContent="≈ "+money(toBirr(u.swt||0))+" · 1 SWT = "+CONFIG.SWT_RATE+" "+t("b");
 $("#tapleft").textContent=left;const r=$("#tapring");r.style.strokeDashoffset=RING*(1-baseLeft/lim);r.classList.toggle("low",baseLeft/lim<.25);
 const bc=$("#tapbonus");bc.style.display=bonus?"":"none";bc.textContent="⚡ +"+bonus;const bn=$("#bonusn");if(bn)bn.textContent="⚡ "+bonus;
 $("#tapbtn").classList.toggle("off",!left)}
function burst(x,y,n){const cols=["#2ea8ff","#19e68c","#ff8a1f","#ffffff","#ffc37a"];
 for(let i=0;i<n;i++){const s=document.createElement("div"),a=Math.random()*6.28,d=40+Math.random()*60;s.className="sp";
  s.style.cssText=`left:${x}px;top:${y}px;background:${cols[i%5]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;box-shadow:0 0 10px ${cols[i%5]}`;
  document.body.appendChild(s);setTimeout(()=>s.remove(),700)}}
let AC=null;
function tapSound(){
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    const t0=AC.currentTime,rare=Math.random()<0.08||(combo>0&&combo%25===0);
    const tone=(f,start,dur,vol,slide)=>{const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.setValueAtTime(f,start);if(slide)o.frequency.exponentialRampToValueAtTime(slide,start+dur);g.gain.setValueAtTime(0.0001,start);g.gain.exponentialRampToValueAtTime(vol,start+0.01);g.gain.exponentialRampToValueAtTime(0.0001,start+dur);o.connect(g).connect(AC.destination);o.start(start);o.stop(start+dur+0.02)};
    if(rare){[1046,1318,1568,2093].forEach((f,i)=>tone(f,t0+i*0.07,0.6,0.12))}
    else tone(1200,t0,0.09,0.18,500);
  }catch(e){}
}
let NB=null;
function fireSound(c){
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    const t0=AC.currentTime,vol=Math.min(0.45,0.1+c/120),dur=0.22;
    if(!NB){NB=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    const src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
    src.buffer=NB;f.type="bandpass";f.Q.value=0.8;f.frequency.setValueAtTime(300,t0);f.frequency.exponentialRampToValueAtTime(900+Math.min(c,50)*20,t0+dur);
    g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(f).connect(g).connect(AC.destination);src.start(t0);src.stop(t0+dur);
    const o=AC.createOscillator(),og=AC.createGain();o.type="sine";o.frequency.setValueAtTime(140,t0);o.frequency.exponentialRampToValueAtTime(60,t0+dur);
    og.gain.setValueAtTime(vol*0.8,t0);og.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(og).connect(AC.destination);o.start(t0);o.stop(t0+dur+0.02);
  }catch(e){}
}
function doTap(e){const u=ST.user,S=ST.set;if(!tapState().left){tg?.HapticFeedback?.notificationOccurred("error");return toast(t("full"))}
 if(!u.tapWin)u.tapWin=Date.now();applyLocal(u,1);pend++;
 tg?.HapticFeedback?.impactOccurred(combo>=10?"medium":"light");
 const b=$("#tapbtn"),rc=b.getBoundingClientRect();
 b.style.setProperty("--rx",((e.clientY-rc.top-rc.height/2)/rc.height*-28)+"deg");b.style.setProperty("--ry",((e.clientX-rc.left-rc.width/2)/rc.width*28)+"deg");
 b.classList.add("p");setTimeout(()=>b.classList.remove("p"),90);
 const st=$("#stage2"),w=document.createElement("div");w.className="wave";st.appendChild(w);setTimeout(()=>w.remove(),620);
 burst(e.clientX,e.clientY,combo>=10?10:6);
 const f=document.createElement("div");f.className="fl";f.textContent="+"+S.tapReward+" SWT";f.style.left=e.clientX-34+(Math.random()*40-20)+"px";f.style.top=e.clientY-40+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),900);
 // combo (visual only)
 const now=Date.now();combo=now-lastTap<500?combo+1:1;lastTap=now;
 const cb=$("#combo");if(combo>=5){cb.textContent=(combo>=25?"🔥🔥 ":"🔥 ")+"x"+combo;cb.classList.remove("bump");void cb.offsetWidth;cb.classList.add("bump")}
 st.classList.toggle("hot",combo>=10);tapSound();if(combo>=10)fireSound(combo);
 if(combo>0&&combo%25===0){const c=$("#tapcard");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");cb.textContent="🔥🔥 "+t("fire")+" x"+combo;burst(e.clientX,e.clientY,22);tg?.HapticFeedback?.notificationOccurred("success")}
 clearTimeout(comboT);comboT=setTimeout(()=>{combo=0;const c=$("#combo");if(c)c.textContent="";const s=$("#stage2");if(s)s.classList.remove("hot")},900);
 updTap();clearTimeout(flT);flT=setTimeout(flush,600)}
async function flush(){if(!pend||!ST.user)return;const n=pend;pend=0;const r=await api("tap",{n});if(r.user){ST.user=r.user;if(pend)applyLocal(ST.user,pend);updTap()}}
document.addEventListener("visibilitychange",()=>{if(document.hidden)flush()});
setInterval(()=>{if(ST.tab!=="tap"||!ST.user)return;const u=ST.user,el=$("#tapreset");if(!el)return;if(u.tapWin){const r=36e5-(Date.now()-u.tapWin);if(r<=0){u.taps=0;u.tapWin=0;updTap();el.textContent="—:—"}else el.textContent=String(Math.floor(r/6e4)).padStart(2,"0")+":"+String(Math.floor(r/1e3)%60).padStart(2,"0")}else el.textContent="—:—"},1000);
/* live log refresh */
setInterval(async()=>{if(!ST.user)return;const r=await api("log");if(r.tasks){ST.tasks=r.tasks;newTaskPop(r.tasks)}if(r.wd&&JSON.stringify(r.wd)!==JSON.stringify(ST.wd)){ST.wd=r.wd;if(ST.tab==="admin")render()}recheck();if(ST.tab!=="home")return;const n=JSON.stringify(r.log),o=JSON.stringify(ST.log);if(n!==o){ST.log=r.log;const b=$("#logbox");if(b)b.innerHTML=logHTML()}},10000);
document.documentElement.lang=L;applyTheme(localStorage.thm||0);
api("init",{ref:REF,user:TU}).then(async r=>{Object.assign(ST,r);render();await gate();newTaskPop(ST.tasks)});
